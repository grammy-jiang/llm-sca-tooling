name: verify

on:
  push:
    branches: ["main", "master", "agent/**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  verify:
    name: verify gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks-action needs history to compute the commit range
          # for its scan; default fetch-depth: 1 makes
          # `<commit>^..<commit>` ranges unresolvable.  Mirrors the
          # fetch-depth: 0 already used in publish.yml.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Set up Node (ts-morph backend runner)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ts-morph runner deps
        run: npm install --no-audit --no-fund
        working-directory: src/llm_sca_tooling/indexing/backends/typescript/runner

      - name: Format check (isort)
        run: uv run isort --check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Import architecture (lint-imports)
        run: |
          if [ -d src ]; then
            uv run lint-imports
          else
            echo "lint-imports: skipping — src/ not yet created"
          fi

      - name: Type check (mypy)
        run: |
          if [ -d src ]; then
            uv run mypy src/
          else
            echo "mypy: skipping — src/ not yet created"
          fi

      - name: Unit tests
        run: |
          if [ -d tests/unit ]; then
            uv run pytest tests/unit/ -x
          else
            echo "pytest unit: skipping — tests/unit/ not yet created"
          fi

      - name: Manifest regression tests
        run: uv run pytest tests/harness/ -x

      # Full suite: the fast verify gate covers tests/unit + tests/harness
      # only, which let schema-regression and storage-contract failures sit
      # unnoticed on master. CI runs everything (~15s) and enforces the
      # coverage floor (fail_under = 85, previously declared but never run).
      - name: Full test suite + coverage floor
        run: >-
          uv run pytest tests/
          --cov=src/llm_sca_tooling
          --cov-report=term-missing
          --cov-fail-under=85

      - name: Schema export drift
        run: |
          uv run python -c "from llm_sca_tooling.schemas.json_schema import export_all; export_all()"
          git diff --exit-code -- schemas/

      - name: Secrets scan (detect-secrets)
        run: uv run detect-secrets scan --baseline .secrets.baseline

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit

      - name: SAST (bandit)
        run: |
          # Mirror the Makefile's _sast target: --severity-level medium
          # so Low-severity informational findings don't fail CI.  The
          # local `make verify` uses the same threshold; CI was lagging.
          if [ -d src ]; then
            uv run bandit -r src/ -c pyproject.toml --severity-level medium
          else
            echo "bandit: skipping — src/ not yet created"
          fi
